name: MusicStore CI

on:
  push:
    branches: [main, 'lab5/**', 'lab6/**']
  pull_request:
    branches: [main, 'lab5/**', 'lab6/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Format and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Restore pinned dependencies
        run: dotnet restore MusicStore.sln --locked-mode
      - name: Check formatting
        run: make format
      - name: Run tests and coverage gate
        run: |
          mkdir -p reports
          set -o pipefail
          make test 2>&1 | tee reports/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            reports/tests.log
            **/coverage.cobertura.xml
          if-no-files-found: warn

  database:
    name: Disposable PostgreSQL migration and restore
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.12-bookworm
        env:
          POSTGRES_DB: musicstore_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d musicstore_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci-test-only
      TEST_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/musicstore_ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated migration role
        run: docker run --rm --network host -e TEST_DATABASE_URL postgres:17.12-bookworm sh -c 'psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE musicstore_migrator NOLOGIN; GRANT CREATE ON SCHEMA public TO musicstore_migrator;"'
      - name: Check migrations, idempotence, backup and restore
        run: |
          mkdir -p reports
          set -o pipefail
          docker run --rm --network host -e TEST_DATABASE_URL -v "$PWD:/work" -w /work postgres:17.12-bookworm bash scripts/check-db.sh 2>&1 | tee reports/database.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-report
          path: reports/database.log
          if-no-files-found: warn

  security:
    name: SAST, secrets and dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned Semgrep
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Run local SAST command
        run: |
          mkdir -p reports
          set -o pipefail
          make sast 2>&1 | tee reports/semgrep.log
      - name: Scan repository for secrets and vulnerable dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: reports/trivy-filesystem.txt
      - name: Show scanner findings in job log
        if: always()
        run: cat reports/trivy-filesystem.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn

  container:
    name: Container environment and image scan
    runs-on: ubuntu-24.04
    needs: [quality, database, security]
    steps:
      - uses: actions/checkout@v4
      - name: Run the same container check as locally
        run: |
          mkdir -p reports
          set -o pipefail
          make container-check 2>&1 | tee reports/container.log
      - name: Scan built application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: musicstore-api:lab4
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: reports/trivy-image.txt
      - name: Show image findings in job log
        if: always()
        run: cat reports/trivy-image.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-reports
          path: reports/
          if-no-files-found: warn

  publish:
    name: Publish image after all gates
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: [quality, database, security, container]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute immutable image tag
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
