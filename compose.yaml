name: musicstore-lab4

services:
  db:
    image: postgres:17.12-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - postgres_password
      - app_db_password
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/container-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musicstore"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200

  migrator:
    image: postgres:17.12-bookworm
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres@db:5432/musicstore
    secrets:
      - postgres_password
    volumes:
      - ./database/migrations:/database/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
      - ./scripts/container-migrate.sh:/scripts/container-migrate.sh:ro
    networks:
      - backend
    entrypoint: ["bash", "/scripts/container-migrate.sh"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 50

  app:
    image: musicstore-api:lab4
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped
    user: "1000:1000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=musicstore;Username=musicstore_app
      DbPasswordFile: /run/secrets/app_db_password
      JwtKeyFile: /run/secrets/jwt_key
      Jwt__Issuer: MusicStoreApi
      Jwt__Audience: MusicStoreClient
      Jwt__ExpiresInHours: "24"
    secrets:
      - app_db_password
      - jwt_key
    ports:
      - "8080:8080"
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "dotnet", "MusicStore.Api.dll", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100

  db-tools:
    profiles: ["tools"]
    image: postgres:17.12-bookworm
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - postgres_password
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    networks:
      - backend
    entrypoint: ["bash"]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 50

  restore-db:
    profiles: ["restore"]
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: musicstore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
    secrets:
      - postgres_password
      - app_db_password
    volumes:
      - restore_data:/var/lib/postgresql/data
      - ./database/container-init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musicstore"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200

networks:
  backend:
    internal: true
  frontend:

volumes:
  db_data:
  restore_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  app_db_password:
    file: ./secrets/app_db_password
  jwt_key:
    file: ./secrets/jwt_key
